name: Fetch Digital Trends

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install requests feedparser beautifulsoup4
          python -c "import feedparser; print('feedparser version:', feedparser.__version__)"
      
      - name: Fetch trends
        run: |
          mkdir -p data
          python scripts/fetch-trends.py 2>&1 | tee data/fetch.log
      
      - name: Upload log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fetch-log
          path: data/fetch.log
      
      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "Update trends $(date -u +%Y-%m-%d-%H:%M)"
            git push
          else
            echo "No changes to commit"
          fi
